services:
  api:
    build: .
    container_name: sg_analytics_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - redis
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: qdrant_db
    # Bound to loopback only – remove or restrict further in production.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  redis:
    image: redis:7.2-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    container_name: redis_cache
    # Bound to loopback only – remove or restrict further in production.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --save 60 1 --loglevel warning

volumes:
  qdrant_data:
  redis_data:
